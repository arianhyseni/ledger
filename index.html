<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101C24">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <button class="stepper" id="prevMonth" aria-label="Previous month">&#8249;</button>
  <div class="monthbox">
    <span class="eyebrow" id="topEyebrow">Month</span>
    <h1 id="monthLabel">—</h1>
  </div>
  <button class="stepper" id="nextMonth" aria-label="Next month">&#8250;</button>
</header>

<main>

<!-- ============ EXPENSES ============ -->
<section class="screen" id="screen-expenses">

  <div class="card strip-card">
    <div class="strip-head">
      <label class="eyebrow" for="incomeInput">Income this month</label>
      <div class="income-edit">
        <input type="number" id="incomeInput" inputmode="decimal" step="0.01" placeholder="0.00">
        <span class="cur cur-sym">&euro;</span>
      </div>
    </div>

    <div class="strip">
      <div class="strip-fill" id="stripFill"></div>
      <div class="strip-marker" id="stripMarker" hidden></div>
    </div>
    <div class="strip-legend">
      <span id="stripSpent">0.00 spent</span>
      <span id="stripLeft">—</span>
    </div>

    <dl class="metrics">
      <div><dt>Avg / day</dt><dd id="mAvg">0.00</dd></div>
      <div><dt>Projected</dt><dd id="mProj">0.00</dd></div>
      <div><dt>Save rate</dt><dd id="mSave">—</dd></div>
    </dl>
  </div>

  <form class="card form" id="expenseForm" autocomplete="off">
    <span class="eyebrow">Add expense</span>

    <div class="row">
      <div class="field grow">
        <label for="exAmount">Amount</label>
        <input type="number" id="exAmount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="exDate">Date</label>
        <input type="date" id="exDate" required>
      </div>
    </div>

    <div class="row">
      <div class="field grow">
        <label for="exCategory">Category</label>
        <select id="exCategory" required></select>
      </div>
      <div class="field grow">
        <label for="exStore">Store</label>
        <input type="text" id="exStore" list="storeList" placeholder="Optional">
        <datalist id="storeList"></datalist>
      </div>
    </div>

    <div class="field">
      <label for="exNote">Note</label>
      <input type="text" id="exNote" placeholder="Optional">
    </div>

    <div class="row bottom">
      <label class="shoot" for="exPhoto">
        <input type="file" id="exPhoto" accept="image/*" capture="environment" hidden>
        <span id="photoLabel">Attach receipt</span>
      </label>
      <button type="submit" class="primary">Save expense</button>
    </div>
  </form>

  <div class="listhead">
    <span class="eyebrow">Entries</span>
    <span class="eyebrow" id="entryCount"></span>
  </div>
  <div id="expenseList"></div>
</section>

<!-- ============ PRICES ============ -->
<section class="screen" id="screen-prices" hidden>

  <div class="card">
    <div class="row bottom">
      <div class="field grow">
        <label for="prodSearch" class="eyebrow">Find product</label>
        <input type="search" id="prodSearch" placeholder="Type a name or barcode">
      </div>
      <button class="ghost" id="toggleNewProduct" type="button">+ New</button>
    </div>
  </div>

  <form class="card form" id="productForm" autocomplete="off" hidden>
    <span class="eyebrow">New product</span>
    <div class="row">
      <div class="field grow">
        <label for="pName">Name</label>
        <input type="text" id="pName" required placeholder="e.g. Milk 1L">
      </div>
      <div class="field">
        <label for="pUnit">Unit</label>
        <select id="pUnit">
          <option value="pcs">pcs</option>
          <option value="kg">kg</option>
          <option value="l">l</option>
          <option value="pack">pack</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="pCategory">Category</label>
        <select id="pCategory"></select>
      </div>
      <div class="field grow">
        <label for="pBarcode">Barcode</label>
        <input type="text" id="pBarcode" inputmode="numeric" placeholder="Optional">
      </div>
    </div>
    <button type="submit" class="primary">Save product</button>
  </form>

  <div class="listhead">
    <span class="eyebrow">Products</span>
    <span class="eyebrow" id="productCount"></span>
  </div>
  <div id="productList"></div>
</section>

<!-- ============ INSIGHTS ============ -->
<section class="screen" id="screen-insights" hidden>
  <div id="insightsBody"></div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="screen" id="screen-settings" hidden>

  <div class="card form">
    <span class="eyebrow">Preferences</span>
    <div class="row">
      <div class="field grow">
        <label for="setCurrency">Currency symbol</label>
        <input type="text" id="setCurrency" maxlength="3" placeholder="&euro;">
      </div>
      <div class="field grow">
        <label for="setTarget">Savings target (%)</label>
        <input type="number" id="setTarget" inputmode="numeric" min="0" max="90" placeholder="20">
      </div>
    </div>
  </div>

  <div class="card form">
    <span class="eyebrow">Categories</span>
    <div class="row bottom">
      <div class="field grow">
        <input type="text" id="newCategory" placeholder="New category name">
      </div>
      <button class="ghost" id="addCategory" type="button">Add</button>
    </div>
    <div class="taglist" id="categoryList"></div>
  </div>

  <div class="card form">
    <span class="eyebrow">Stores</span>
    <div class="row bottom">
      <div class="field grow">
        <input type="text" id="newStore" placeholder="New store name">
      </div>
      <button class="ghost" id="addStore" type="button">Add</button>
    </div>
    <div class="taglist" id="storeManageList"></div>
  </div>

  <div class="card form">
    <span class="eyebrow">Backup</span>
    <p class="hint">Your data lives only in this browser. Clearing site data erases it. Export regularly.</p>
    <div class="row">
      <button class="ghost grow" id="exportBtn" type="button">Export JSON</button>
      <label class="ghost grow center" for="importFile">Import JSON
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
    </div>
    <button class="danger" id="wipeBtn" type="button">Erase all data</button>
  </div>
</section>

</main>

<nav class="tabs">
  <button class="tab active" data-screen="expenses">Expenses</button>
  <button class="tab" data-screen="prices">Prices</button>
  <button class="tab" data-screen="insights">Insights</button>
  <button class="tab" data-screen="settings">Settings</button>
</nav>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="Receipt">
  <button id="viewerClose">Close</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="dexie.min.js"></script>
<script src="db.js"></script>
<script src="expenses.js"></script>
<script src="prices.js"></script>
<script src="insights.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
